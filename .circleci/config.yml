          command: |
            : > session.tls
      - run:
          name: Build TLS stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tlsResume -j2
      - run:
          name: Resume session ticket
          command: LIONSS_LP=1 ./build/tlsResume --session session.tls --tls13

